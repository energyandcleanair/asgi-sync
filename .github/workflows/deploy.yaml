name: Deployment workflow

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      force:
        description: "Tag the tested image as latest even when not running from main"
        type: "boolean"
        required: false
        default: false

env:
  IMAGE_NAME: europe-docker.pkg.dev/crea-aq-data/creaengine/agsi-pipeline
  WORKLOAD_IDENTITY_PROVIDER: projects/829505003332/locations/global/workloadIdentityPools/github-identity-pool/providers/github-identity-provider
  SERVICE_ACCOUNT: github-actions@crea-aq-data.iam.gserviceaccount.com

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      latest_tag: ${{ steps.image.outputs.latest_tag }}
      test_tag: ${{ steps.image.outputs.test_tag }}
      production_tag: ${{ steps.image.outputs.production_tag }}
      test_artifact_name: ${{ steps.image.outputs.test_artifact_name }}
      production_artifact_name: ${{ steps.image.outputs.production_artifact_name }}
    steps:
      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          echo "test_tag=agsi-pipeline-test:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "production_tag=agsi-pipeline-production:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "test_artifact_name=agsi-pipeline-test-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "production_artifact_name=agsi-pipeline-production-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  test-image:
    name: build test image
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: Dockerfile
          target: test
          tags: ${{ needs.metadata.outputs.test_tag }}
          outputs: type=docker,dest=/tmp/agsi-pipeline-test.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: Dockerfile
          target: runtime
          tags: ${{ needs.metadata.outputs.production_tag }}
          outputs: type=docker,dest=/tmp/agsi-pipeline-production.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.test_artifact_name }}
          path: /tmp/agsi-pipeline-test.tar
          retention-days: 1

      - name: Upload production image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.production_artifact_name }}
          path: /tmp/agsi-pipeline-production.tar
          retention-days: 1

  test:
    name: test in container
    runs-on: ubuntu-latest
    needs:
      - metadata
      - test-image
    permissions:
      contents: read
    env:
      TEST_TAG: ${{ needs.metadata.outputs.test_tag }}
      PRODUCTION_TAG: ${{ needs.metadata.outputs.production_tag }}
    steps:
      - name: Download test image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.test_artifact_name }}
          path: /tmp

      - name: Download production image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.production_artifact_name }}
          path: /tmp

      - name: Load test image
        shell: bash
        run: docker load --input /tmp/agsi-pipeline-test.tar

      - name: Run pytest
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$TEST_TAG"

      - name: Load production image
        shell: bash
        run: docker load --input /tmp/agsi-pipeline-production.tar

      - name: Smoke check production image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$PRODUCTION_TAG" --help

  push-sha:
    name: push sha image
    runs-on: ubuntu-latest
    needs:
      - metadata
      - test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCTION_TAG: ${{ needs.metadata.outputs.production_tag }}
      SHA_TAG: ${{ needs.metadata.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker
        shell: bash
        run: gcloud auth configure-docker europe-docker.pkg.dev --quiet

      - name: Download tested production image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.production_artifact_name }}
          path: /tmp

      - name: Push tested image with SHA tag
        shell: bash
        run: |
          set -euo pipefail
          docker load --input /tmp/agsi-pipeline-production.tar
          docker tag "$PRODUCTION_TAG" "$SHA_TAG"
          docker push "$SHA_TAG"

  push-latest:
    name: tag latest
    runs-on: ubuntu-latest
    needs:
      - metadata
      - push-sha
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.force)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Tag SHA image as latest
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts docker tags add \
            "${{ needs.metadata.outputs.sha_tag }}" \
            "${{ needs.metadata.outputs.latest_tag }}" \
            --quiet

  provision-infra:
    name: provision infra
    runs-on: ubuntu-latest
    needs:
      - metadata
      - push-sha
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Provision runtime infrastructure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/infra/provision
          ./scripts/infra/provision
